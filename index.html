<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 内联 data-uri favicon：dev server 无 favicon.ico 的 404 噪音一行消除（E10 观察#5） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='6' y='10' width='4' height='4' rx='1' fill='%238a93a6'/%3E%3Cpath d='M4 6a4 4 0 0 1 8 0v4h-8z' fill='%23c9a86b'/%3E%3C/svg%3E" />
  <title>长夜驿站 · 第一夜</title>
  <!-- 生产构建用：viewer 保持 external，由该 importmap 指向随 dist 复制的
       /vendor/aholo-viewer/（worker 相对路径依赖同目录文件）。dev 下此表不生效。 -->
  <script type="importmap">
    { "imports": { "@manycore/aholo-viewer": "./vendor/aholo-viewer/index.js" } }
  </script>
  <style>
    :root {
      --ink: #0b0d12;
      --paper: #e8e2d4;
      --gold: #c9a86b;
      --dim: #8a93a6;
      --red: #d96a5a;
      --green: #8fd48a;
    }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
    #app { position: fixed; inset: 0; transition: filter 0.5s; }
    #app.flash-on { filter: brightness(1.32) saturate(1.06); }
    #app.flash-off { filter: brightness(0.84); }
    /* N7 三线氛围变体（同definitions下潜开始即应用——世界从落进来的那一刻就是你的账本显形；
       后定义覆盖 flash-on/off：终幕手电增亮无意义，可接受） */
    #app.finale-debt { filter: grayscale(0.82) brightness(0.66) contrast(1.08) sepia(0.22); }
    #app.finale-chaos { filter: saturate(1.55) hue-rotate(58deg) contrast(1.1) brightness(0.96); }

    #hud {
      position: fixed; right: 8px; top: 8px; z-index: 60;
      color: #7dffb0; background: rgba(0, 0, 0, 0.55);
      font: 12px/1.6 Consolas, monospace; padding: 6px 10px;
      white-space: pre; pointer-events: none;
    }
    #hint {
      position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); z-index: 20;
      color: #cfe8ff; background: rgba(0, 0, 0, 0.55);
      font: 13px/1.6 system-ui, sans-serif; padding: 6px 14px; border-radius: 4px;
      pointer-events: none; transition: opacity 0.5s;
    }

    #game-ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    #game-ui > * { pointer-events: none; }

    /* ===== 下潜 HUD ===== */
    .g-hud > * { position: fixed; }
    .g-goal {
      left: 14px; top: 12px; z-index: 21; pointer-events: none;
      background: linear-gradient(160deg, rgba(12,15,22,0.92), rgba(12,15,22,0.75));
      border: 1px solid rgba(201,168,107,0.5); border-left: 3px solid var(--gold);
      padding: 10px 14px; border-radius: 3px; color: var(--paper);
      font: 13px/1.7 system-ui, "Microsoft YaHei", sans-serif; max-width: 320px;
      box-shadow: 0 2px 18px rgba(0,0,0,0.45);
    }
    .g-goal-night { color: var(--gold); font-family: KaiTi, STKaiti, serif; font-size: 15px; letter-spacing: 2px; }
    .g-goal-bill { font-size: 14px; margin-top: 2px; }
    .g-goal-bill.ok { color: var(--green); }
    .g-goal-hint { color: var(--dim); font-size: 12px; }

    .g-count {
      left: 50%; top: 10px; transform: translateX(-50%); z-index: 21;
      color: var(--paper); background: rgba(0,0,0,0.55);
      font: bold 22px/1.4 Consolas, monospace; letter-spacing: 1px;
      padding: 4px 18px; border-radius: 3px; border: 1px solid rgba(232,226,212,0.25);
    }
    .g-count.danger { color: #ff6a5a; border-color: rgba(255,106,90,0.6); animation: g-pulse 1s infinite; }
    @keyframes g-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

    .g-codex {
      left: 14px; bottom: 14px; z-index: 21; color: var(--dim);
      font: 12px/1.5 system-ui, "Microsoft YaHei", sans-serif;
    }
    .g-codex-title { color: var(--gold); font-family: KaiTi, STKaiti, serif; letter-spacing: 3px; margin-bottom: 4px; }
    .g-codex-row { display: flex; gap: 8px; }
    .g-codex-slot {
      width: 74px; padding: 6px 4px; text-align: center;
      background: rgba(12,15,22,0.8); border: 1px solid rgba(138,147,166,0.3); border-radius: 3px;
      filter: grayscale(1) brightness(0.6); transition: all 0.4s;
    }
    .g-codex-slot.lit { filter: none; border-color: var(--gold); box-shadow: 0 0 12px rgba(201,168,107,0.35); }
    .g-codex-icon { font: 22px/1.3 KaiTi, STKaiti, serif; color: var(--paper); }
    .g-codex-slot.lit .g-codex-icon { color: var(--gold); }
    .g-codex-name { color: var(--paper); }
    .g-codex-val { font-size: 11px; }

    .g-keys {
      left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 21;
      color: var(--dim); font: 12px/1 system-ui, "Microsoft YaHei", sans-serif;
      background: rgba(0,0,0,0.5); padding: 7px 12px; border-radius: 3px;
      display: flex; gap: 10px; align-items: center; white-space: nowrap;
    }
    .g-key {
      border: 1px solid rgba(232,226,212,0.45); border-bottom-width: 2px; border-radius: 3px;
      padding: 2px 6px; color: var(--paper); font: 11px Consolas, monospace;
    }
    .g-keylab { margin-right: 4px; }

    .g-meters { right: 14px; bottom: 14px; z-index: 21; display: flex; flex-direction: column; gap: 5px; }
    .g-meter-row { display: flex; align-items: center; gap: 6px; font: 11px system-ui, sans-serif; color: var(--dim); }
    .g-bar { width: 110px; height: 7px; background: rgba(255,255,255,0.12); border-radius: 4px; overflow: hidden; }
    .g-bar-fill { height: 100%; width: 0%; border-radius: 4px; transition: width 0.15s; }
    .g-noise { background: linear-gradient(90deg, #6a8f6a, #d9b96a, #e06a5a); }
    .g-bar.hot { box-shadow: 0 0 8px rgba(224,106,90,0.8); }
    .g-stam { background: #6a93c9; }
    /* 理智条（N4 黑暗理智）：青玉色，低值转暗红脉动 */
    .g-san { background: linear-gradient(90deg, #4fb89e, #8fe0cc); }
    .g-san.low { background: linear-gradient(90deg, #a04848, #d97a5a); animation: g-pulse 1.2s infinite; }

    .g-prompt {
      left: 50%; top: 58%; transform: translateX(-50%); z-index: 21;
      color: var(--paper); background: rgba(0,0,0,0.55);
      font: 15px/1.6 system-ui, "Microsoft YaHei", sans-serif;
      padding: 6px 16px; border-radius: 3px; border: 1px solid rgba(201,168,107,0.5);
      opacity: 0; transition: opacity 0.25s; text-align: center;
    }

    .g-bubble {
      left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 22;
      max-width: min(640px, 84vw);
      background: rgba(10,12,18,0.9); border: 1px solid rgba(201,168,107,0.6);
      color: var(--paper); padding: 8px 14px; border-radius: 6px;
      font: 14px/1.7 system-ui, "Microsoft YaHei", sans-serif;
      opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none;
    }
    .g-bubble.on { opacity: 1; }
    .g-bubble-arch { color: var(--gold); font-family: KaiTi, STKaiti, serif; margin-right: 8px; }

    /* ===== 全屏视觉层 ===== */
    .g-vig { position: fixed; inset: 0; z-index: 15; pointer-events: none; transition: opacity 0.6s; }
    .g-vig.vig-off { opacity: 0; }
    .g-vig.vig-dark {
      opacity: 1;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 68%, rgba(0,0,0,0.9) 100%);
    }
    .g-vig.vig-bright {
      opacity: 0.5;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.25) 85%, rgba(0,0,0,0.45) 100%);
    }
    .g-fear {
      position: fixed; inset: 0; z-index: 16; pointer-events: none; opacity: 0; transition: opacity 0.4s;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(120,10,10,0.35) 90%, rgba(90,0,0,0.6) 100%);
    }
    /* 雾层（开阔夜补偿，opacity=NightDef.fog；只在下潜 HUD 显示时生效） */
    .g-fog {
      position: fixed; inset: 0; z-index: 14; pointer-events: none; opacity: 0; transition: opacity 1.4s;
      background:
        linear-gradient(180deg, rgba(150,160,178,0.28) 0%, rgba(150,160,178,0) 22%),
        radial-gradient(ellipse at center, rgba(150,160,178,0.10) 30%, rgba(140,150,170,0.42) 68%, rgba(120,132,152,0.8) 100%);
      mix-blend-mode: screen;
    }
    /* 雪雾（N3：白偏冷，浓度低于 N2 灰蓝雾；缓漂移=落雪感） */
    .g-fog.snow {
      background:
        linear-gradient(180deg, rgba(216,230,240,0.32) 0%, rgba(216,230,240,0) 26%),
        radial-gradient(ellipse at center, rgba(220,232,242,0.10) 30%, rgba(206,222,234,0.34) 68%, rgba(190,208,224,0.62) 100%);
      animation: snow-drift 26s ease-in-out infinite alternate;
    }
    @keyframes snow-drift {
      from { transform: translate3d(0, 0, 0) scale(1.02); }
      to { transform: translate3d(-1.4%, 0.7%, 0) scale(1.05); }
    }
    /* 水下青雾（N4：冷青偏色，screen 叠加；缓漂移+微呼吸=在水里的光） */
    .g-fog.deepsea {
      background:
        linear-gradient(180deg, rgba(96,168,160,0.30) 0%, rgba(96,168,160,0) 28%),
        radial-gradient(ellipse at center, rgba(108,176,168,0.12) 28%, rgba(84,150,146,0.40) 66%, rgba(40,88,92,0.78) 100%);
      animation: deepsea-drift 30s ease-in-out infinite alternate;
    }
    @keyframes deepsea-drift {
      from { transform: translate3d(0, 0, 0) scale(1.02); filter: brightness(1); }
      to { transform: translate3d(1.2%, -0.6%, 0) scale(1.06); filter: brightness(0.88); }
    }
    /* 沙尘暖雾（N5 沙漠×图书馆：暖沙色 screen 叠加，缓漂移=沙流过书巷） */
    .g-fog.sand {
      background:
        linear-gradient(180deg, rgba(214,186,142,0.30) 0%, rgba(214,186,142,0) 26%),
        radial-gradient(ellipse at center, rgba(222,196,150,0.10) 30%, rgba(210,178,132,0.38) 68%, rgba(150,118,84,0.72) 100%);
      animation: sand-drift 24s ease-in-out infinite alternate;
    }
    @keyframes sand-drift {
      from { transform: translate3d(0, 0, 0) scale(1.02); }
      to { transform: translate3d(1.5%, 0.4%, 0) scale(1.05); }
    }
    /* 冷热双色带（N6 镜像夜·冰园×烬园：半冷冰蓝半暖烬橙的渐变雾层，缓漂移=两界拉锯） */
    .g-fog.dualband {
      background:
        linear-gradient(100deg,
          rgba(120,164,214,0.34) 0%, rgba(120,164,214,0.10) 34%,
          rgba(120,164,214,0.05) 46%, rgba(224,138,66,0.05) 54%,
          rgba(224,138,66,0.10) 66%, rgba(228,144,72,0.34) 100%),
        radial-gradient(ellipse at center, rgba(150,150,170,0.08) 30%, rgba(130,140,160,0.34) 68%, rgba(60,66,84,0.7) 100%);
      animation: dualband-drift 28s ease-in-out infinite alternate;
    }
    @keyframes dualband-drift {
      from { transform: translate3d(0, 0, 0) scale(1.02); }
      to { transform: translate3d(-1.6%, 0, 0) scale(1.05); }
    }
    /* 花海暖调（N7 终幕：暖金偏粉晨光雾层，浓度全夜最低——情感回报；缓漂移=花瓣浮动） */
    .g-fog.flora {
      background:
        linear-gradient(180deg, rgba(255,222,178,0.30) 0%, rgba(255,214,170,0) 26%),
        radial-gradient(ellipse at center, rgba(255,226,186,0.10) 30%, rgba(240,192,158,0.34) 68%, rgba(196,146,124,0.62) 100%);
      animation: flora-drift 32s ease-in-out infinite alternate;
    }
    @keyframes flora-drift {
      from { transform: translate3d(0, 0, 0) scale(1.02); filter: brightness(1); }
      to { transform: translate3d(1.0%, 0.6%, 0) scale(1.06); filter: brightness(1.06); }
    }
    /* 黑暗理智低值水波纹暗角（N4）：层叠环形波纹+暗角，缓慢缩放呼吸（CSS 零新资产） */
    .g-mad {
      position: fixed; inset: 0; z-index: 17; pointer-events: none;
      opacity: 0; transition: opacity 0.8s;
      background:
        repeating-radial-gradient(ellipse at center, rgba(0,0,0,0) 0 34px, rgba(24,52,54,0.16) 44px, rgba(0,0,0,0) 54px),
        radial-gradient(ellipse at center, rgba(0,0,0,0) 34%, rgba(14,40,42,0.42) 72%, rgba(2,10,12,0.9) 100%);
    }
    .g-mad.on { opacity: 1; animation: mad-ripple 3.2s ease-in-out infinite; }
    @keyframes mad-ripple {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }
    .g-flash { position: fixed; inset: 0; z-index: 40; background: #000; opacity: 0; pointer-events: none; }
    /* 红晕一瞬（N3 寻仇残影逼近） */
    .g-redflash {
      position: fixed; inset: 0; z-index: 41; opacity: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(150,12,12,0.16) 40%, rgba(160,0,0,0.5) 100%);
    }

    /* ===== 2D 屏幕流 ===== */
    .g-screens { position: fixed; inset: 0; z-index: 30; }
    .g-screen {
      position: absolute; inset: 0; pointer-events: auto; overflow-y: auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 40px 20px; color: var(--paper);
      background:
        radial-gradient(1200px 700px at 70% 20%, rgba(201,168,107,0.07), transparent 60%),
        radial-gradient(900px 600px at 20% 80%, rgba(90,110,150,0.08), transparent 60%),
        linear-gradient(180deg, #0b0d12 0%, #0e1118 55%, #0a0c10 100%);
      font: 15px/1.8 system-ui, "Microsoft YaHei", sans-serif;
    }
    .g-screen h1, .g-screen h2 {
      font-family: KaiTi, STKaiti, serif; font-weight: 700; color: var(--paper);
      letter-spacing: 10px; margin: 0;
    }
    .g-screen h2 { font-size: 30px; letter-spacing: 8px; border-bottom: 1px solid rgba(201,168,107,0.4); padding-bottom: 8px; }

    .g-title-quote { color: var(--dim); font-family: KaiTi, STKaiti, serif; font-size: 17px; text-align: center; line-height: 2; }
    .g-title-main { font-size: clamp(56px, 10vw, 110px); text-shadow: 0 0 40px rgba(201,168,107,0.25); }
    .g-title-sub { color: var(--gold); letter-spacing: 6px; font-family: KaiTi, STKaiti, serif; }
    .g-title-row { display: flex; gap: 10px; align-items: center; }
    .g-title-lab { color: var(--dim); }
    .g-name-input, .g-talkbox-input {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(201,168,107,0.5); border-radius: 3px;
      color: var(--paper); font: 16px/1.5 system-ui, sans-serif; padding: 8px 12px; outline: none; width: 240px;
    }
    .g-name-input:focus, .g-talkbox-input:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(201,168,107,0.3); }

    .g-arch-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .g-arch-card {
      width: 190px; padding: 14px; text-align: center; cursor: pointer;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(138,147,166,0.35); border-radius: 4px;
      transition: all 0.25s;
    }
    .g-arch-card:hover { border-color: var(--gold); }
    .g-arch-card.sel { border-color: var(--gold); background: rgba(201,168,107,0.12); box-shadow: 0 0 18px rgba(201,168,107,0.25); }
    .g-arch-name { font-family: KaiTi, STKaiti, serif; font-size: 22px; letter-spacing: 4px; color: var(--paper); }
    .g-arch-tag { color: var(--gold); font-size: 12px; margin: 2px 0 6px; }
    .g-arch-desc { color: var(--dim); font-size: 12px; line-height: 1.6; }

    .g-btn {
      pointer-events: auto; cursor: pointer; border-radius: 3px;
      font: 15px/1.4 system-ui, "Microsoft YaHei", sans-serif; padding: 10px 22px;
      background: rgba(255,255,255,0.04); color: var(--paper); border: 1px solid rgba(138,147,166,0.5);
      transition: all 0.2s; letter-spacing: 2px;
    }
    .g-btn:hover { border-color: var(--paper); }
    .g-btn.primary { border-color: var(--gold); color: var(--gold); }
    .g-btn.primary:hover { background: rgba(201,168,107,0.15); box-shadow: 0 0 14px rgba(201,168,107,0.3); }
    .g-btn.big { font-size: 18px; padding: 14px 34px; }
    .g-btn.small { font-size: 13px; padding: 6px 14px; }
    .g-btn.ghost { border-style: dashed; color: var(--dim); }
    .g-btn.danger { border-color: var(--red); color: var(--red); }
    .g-btn-row { display: flex; gap: 12px; align-items: center; }
    .g-btn-row.center { justify-content: center; }
    .g-btn-row.col { flex-direction: column; }

    .g-ai-mark {
      position: absolute; right: 12px; bottom: 10px; color: rgba(138,147,166,0.75);
      font: 11px/1.4 system-ui, sans-serif; pointer-events: none;
    }

    .g-hub-head { text-align: center; }
    .g-hub-sub { color: var(--dim); letter-spacing: 2px; }
    .g-hub-cols { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
    .g-quest, .g-ledger {
      width: 400px; max-width: 92vw; padding: 18px 20px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(201,168,107,0.35); border-radius: 4px;
    }
    .g-quest-tag { color: var(--gold); font-size: 12px; letter-spacing: 4px; margin-bottom: 6px; }
    .g-quest-title { font-family: KaiTi, STKaiti, serif; font-size: 20px; margin-bottom: 8px; }
    .g-quest-body { color: var(--paper); }
    .g-quest-sign { color: var(--dim); text-align: right; }
    /* N2 选择回响的晨间一行字（N3 起，「世界记得你」） */
    .g-echo-line {
      color: #9fc8e8; font-family: KaiTi, STKaiti, serif; font-size: 17px; letter-spacing: 3px;
      padding: 8px 22px; border: 1px dashed rgba(159, 200, 232, 0.45); border-radius: 3px;
      background: rgba(159, 200, 232, 0.06); animation: echo-in 1.6s ease-out;
    }
    @keyframes echo-in { 0% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 1; transform: none; } }
    .g-ledger-empty { color: var(--dim); }
    .g-ledger-list { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
    .g-ledger-list li { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px dashed rgba(138,147,166,0.2); }
    .ll-type { color: var(--gold); min-width: 3em; }
    .ll-detail { color: var(--paper); }

    /* N4 无住客时伙计的情报行（委托卡内，金色调） */
    .g-keeper-intel { color: var(--gold); font-family: KaiTi, STKaiti, serif; font-size: 16px; margin: 10px 0 0; }
    /* N4 住客卡（#26 常客系统首秀：他就是 N2 被救的人，住下了） */
    .g-guest-card {
      width: 520px; max-width: 92vw; padding: 14px 20px;
      background: linear-gradient(165deg, rgba(143,212,138,0.05), rgba(255,255,255,0.02));
      border: 1px solid rgba(143,212,138,0.45); border-left: 3px solid var(--green);
      border-radius: 4px; animation: echo-in 1.6s ease-out;
    }
    .g-guest-name { color: var(--green); font-family: KaiTi, STKaiti, serif; font-size: 15px; letter-spacing: 4px; margin-bottom: 6px; }
    .g-guest-intro { color: var(--dim); font-size: 13px; margin: 0 0 8px; }
    .g-guest-line { color: var(--paper); font: 15px/1.9 KaiTi, STKaiti, serif; margin: 0 0 6px; }
    .g-guest-intel { color: var(--gold); font-family: KaiTi, STKaiti, serif; font-size: 16px; margin: 0; }

    .g-seam { position: absolute; inset: 0; background: #05060a; overflow: hidden; }
    .g-seam canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .g-seam-label {
      position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
      color: var(--paper); font-family: KaiTi, STKaiti, serif; font-size: 30px; letter-spacing: 12px;
      text-shadow: 0 0 24px rgba(232,226,212,0.55); animation: seam-in 2s ease-out;
    }
    @keyframes seam-in { 0% { opacity: 0; letter-spacing: 24px; } 40% { opacity: 1; } 100% { opacity: 0.9; letter-spacing: 12px; } }
    .g-seam-label.wait { color: var(--dim); font-size: 20px; letter-spacing: 6px; animation: g-pulse 1.6s infinite; }

    .g-settle-lamp { font-family: KaiTi, STKaiti, serif; font-size: 19px; letter-spacing: 2px; }
    .g-settle-lamp.ok { color: var(--green); }
    .g-settle-lamp.bad { color: var(--red); }

    .bill-card {
      width: 640px; max-width: 94vw; color: var(--paper);
      background: linear-gradient(165deg, #10131b, #0b0d12);
      border: 1px solid var(--gold); outline: 1px solid rgba(201,168,107,0.3); outline-offset: 4px;
      padding: 20px 24px; border-radius: 3px; font: 15px/1.9 system-ui, "Microsoft YaHei", sans-serif;
    }
    .bc-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid rgba(201,168,107,0.4); padding-bottom: 6px; }
    .bc-title { font-family: KaiTi, STKaiti, serif; font-size: 26px; letter-spacing: 6px; }
    .bc-night { color: var(--gold); }
    /* 夜型字样（N5 匮乏夜 / N6 镜像夜：账单卡上的金边小签） */
    .bc-tag {
      display: inline-block; margin-left: 8px; padding: 0 7px;
      border: 1px solid var(--gold); border-radius: 2px;
      font-family: KaiTi, "STKaiti", serif; font-size: 13px; letter-spacing: 3px;
      color: var(--gold); transform: translateY(-1px);
    }
    .bc-loot { margin: 8px 0; }
    .bc-item { display: inline-block; margin-right: 12px; color: var(--paper); }
    .bc-item.bc-dim { color: var(--dim); }
    .bc-total { color: var(--gold); }
    .bc-bill { margin: 4px 0; }
    .bc-ok { color: var(--green); } .bc-bad { color: var(--red); }
    .bc-mid { color: var(--dim); font-size: 13px; }
    .bc-quip { color: var(--gold); font-family: KaiTi, STKaiti, serif; margin: 10px 0; }
    .bc-foot { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; border-top: 1px dashed rgba(138,147,166,0.3); padding-top: 8px; }

    .g-talk-scene { color: var(--dim); max-width: 560px; text-align: center; }
    .g-talk-bubble {
      max-width: 620px; background: rgba(201,168,107,0.08); border: 1px solid rgba(201,168,107,0.5);
      border-radius: 6px; padding: 16px 22px;
    }
    .g-talk-bubble p { margin: 8px 0 0; font-family: KaiTi, STKaiti, serif; font-size: 19px; line-height: 2; }
    .g-talk-echo { color: #9fc8e8 !important; font-size: 16px !important; border-top: 1px dashed rgba(159,200,232,0.35); padding-top: 8px; }
    .g-talk-arch { color: var(--gold); font-size: 13px; letter-spacing: 2px; }
    /* N4 住客夜谈段（旅人 · 住客）：青玉色边 */
    .g-talk-guest { border-color: rgba(143, 212, 138, 0.5); background: rgba(143, 212, 138, 0.06); }
    .g-talk-guest .g-talk-arch { color: var(--green); }

    /* ===== 镜像对照页（N6：世界记得你的总和）===== */
    .g-mirror-sub { color: var(--dim); letter-spacing: 4px; font-family: KaiTi, "STKaiti", serif; }
    .g-mirror-rows { display: flex; flex-direction: column; gap: 22px; margin: 26px 0 10px; }
    .g-mirror-row {
      display: flex; align-items: center; gap: 18px; justify-content: center;
      font-family: KaiTi, "STKaiti", serif; font-size: 22px; letter-spacing: 2px;
      animation: echo-in 1.4s ease-out;
    }
    .g-mirror-row:nth-child(2) { animation-delay: 0.35s; opacity: 0; animation-fill-mode: forwards; }
    .g-mirror-row:nth-child(3) { animation-delay: 0.7s; opacity: 0; animation-fill-mode: forwards; }
    .mr-left { color: var(--paper); text-shadow: 0 0 18px rgba(232,226,212,0.2); }
    .mr-sep {
      color: var(--dim); font-size: 16px; padding: 0 4px;
      border-top: 1px dashed rgba(138,147,166,0.4); border-bottom: 1px dashed rgba(138,147,166,0.4);
    }
    .mr-right { color: var(--gold); text-shadow: 0 0 22px rgba(201,168,107,0.35); }

    .g-nights { display: grid; grid-template-columns: repeat(4, 150px); gap: 12px; }
    .g-night {
      text-align: center; padding: 14px 8px; border-radius: 4px;
      border: 1px solid rgba(138,147,166,0.3); background: rgba(255,255,255,0.02);
    }
    .g-night.done { border-color: var(--gold); box-shadow: 0 0 14px rgba(201,168,107,0.25); }
    .g-night.dev { border-style: dashed; }
    .n-num { display: block; font-family: KaiTi, STKaiti, serif; font-size: 26px; color: var(--paper); }
    .g-night.done .n-num { color: var(--gold); }
    .n-name { display: block; font-size: 12px; color: var(--paper); margin: 4px 0; }
    .n-state { display: block; font-size: 11px; color: var(--dim); }
    .g-night.done .n-state { color: var(--green); }
    .g-prog-note { color: var(--dim); font-size: 13px; }

    .g-pause-sub, .g-pause .g-pause-sub { color: var(--dim); letter-spacing: 3px; }

    .g-talkbox {
      position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%);
      display: flex; gap: 8px; pointer-events: auto; z-index: 35;
    }
    .g-talkbox-input { width: min(460px, 70vw); }

    /* ===== 幸存者遭遇对话卡（E2）===== */
    .g-surv {
      position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%);
      width: min(520px, 88vw); pointer-events: auto; z-index: 34;
      background: rgba(10, 12, 18, 0.94); border: 1px solid rgba(201, 168, 107, 0.65);
      border-radius: 6px; padding: 14px 18px 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
      animation: surv-in 0.35s ease-out;
    }
    @keyframes surv-in { 0% { opacity: 0; transform: translate(-50%, 14px); } 100% { opacity: 1; transform: translate(-50%, 0); } }
    .g-surv-name {
      color: var(--gold); font-family: KaiTi, STKaiti, serif; font-size: 15px; letter-spacing: 4px;
      border-bottom: 1px dashed rgba(201, 168, 107, 0.35); padding-bottom: 5px; margin-bottom: 8px;
    }
    .g-surv-plea {
      margin: 0 0 12px; color: var(--paper);
      font: 15px/1.9 KaiTi, STKaiti, serif;
    }
    .g-surv-choices { display: flex; gap: 8px; flex-wrap: wrap; }
    .g-surv-key {
      display: inline-block; margin-left: 6px; padding: 0 5px;
      border: 1px solid rgba(232, 226, 212, 0.4); border-radius: 3px;
      font: 11px Consolas, monospace; color: var(--dim);
    }

    /* ===== N7 终幕 ===== */
    /* 晨间收灯人半张脸（DOM/CSS 剪影演出，零新资产）：门口一束暖光，剪影人形，
       只有半张脸被光照到——设计 §2「收灯人是谁——留白，N7 只给半张脸」 */
    .g-keeper-stage {
      position: relative; width: 240px; height: 300px; margin: 4px auto 0;
      background: linear-gradient(180deg, #0a0c11 0%, #10131c 100%);
      border: 1px solid rgba(201,168,107,0.4); border-radius: 4px; overflow: hidden;
      animation: echo-in 1.8s ease-out;
    }
    /* 门缝里漏出的暖光 */
    .g-keeper-light {
      position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 118px; height: 240px;
      background: linear-gradient(180deg, rgba(255,214,150,0.14) 0%, rgba(255,206,138,0.5) 78%, rgba(255,198,120,0.72) 100%);
      clip-path: polygon(18% 0, 82% 0, 92% 100%, 8% 100%);
    }
    /* 剪影人形：灯前站着，只给轮廓 */
    .g-keeper-figure {
      position: absolute; left: 50%; bottom: 22px; transform: translateX(-42%);
      width: 74px; height: 200px; background: #060708;
      border-radius: 37px 37px 8px 8px;
      box-shadow: 0 0 26px rgba(0,0,0,0.85);
    }
    .g-keeper-figure::before { /* 头 */
      content: ''; position: absolute; left: 50%; top: -52px; transform: translateX(-50%);
      width: 56px; height: 60px; background: #060708; border-radius: 50% 50% 46% 46%;
    }
    /* 半张脸：暖光只削出右半边脸的一线 */
    .g-keeper-face {
      position: absolute; left: 50%; bottom: 158px; transform: translateX(-8%);
      width: 24px; height: 34px; border-radius: 46% 52% 60% 40%;
      background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 34%, rgba(255,208,140,0.4) 40%, rgba(255,214,152,0.85) 100%);
      clip-path: polygon(46% 0, 100% 8%, 100% 100%, 46% 100%);
      filter: blur(0.6px);
    }
    .g-keeper-cap { color: var(--gold); font-family: KaiTi, STKaiti, serif; font-size: 14px; letter-spacing: 6px; text-align: center; margin-top: 6px; }
    .g-keeper-note { color: var(--dim); font-size: 13px; max-width: 460px; text-align: center; }

    /* 告别陈词页：半透明底——花海世界与三线变体滤镜透出来，陈词写在世界的上面 */
    .g-farewell {
      background:
        linear-gradient(180deg, rgba(6,8,12,0.62) 0%, rgba(8,10,15,0.78) 60%, rgba(5,7,10,0.9) 100%);
      justify-content: center;
    }
    .g-farewell h2 { border-bottom-color: rgba(201,168,107,0.55); }
    .g-farewell-sub { color: var(--dim); letter-spacing: 3px; font-family: KaiTi, "STKaiti", serif; }
    .g-farewell-blocks { display: flex; flex-direction: column; gap: 16px; max-width: 640px; width: 92vw; }
    .g-farewell-p {
      background: rgba(10,12,18,0.72); border-left: 3px solid rgba(201,168,107,0.6);
      padding: 12px 18px; border-radius: 3px;
      font: 16px/2 KaiTi, STKaiti, serif; color: var(--paper);
      animation: echo-in 1.4s ease-out; white-space: pre-line;
    }
    .g-farewell-p:nth-child(2) { animation-delay: 0.6s; opacity: 0; animation-fill-mode: forwards; }
    .g-farewell-p:nth-child(3) { animation-delay: 1.2s; opacity: 0; animation-fill-mode: forwards; }
    .g-farewell-p:nth-child(4) { animation-delay: 1.8s; opacity: 0; animation-fill-mode: forwards; }

    /* 结局海报（bill-card 风格三变体，槽 #27 传播钩子：截图即分享） */
    .finale-card {
      width: 640px; max-width: 94vw; color: var(--paper);
      background: linear-gradient(165deg, #10131b, #0b0d12);
      border: 1px solid var(--gold); outline: 1px solid rgba(201,168,107,0.3); outline-offset: 4px;
      padding: 22px 26px; border-radius: 3px; font: 15px/1.9 system-ui, "Microsoft YaHei", sans-serif;
    }
    .fc-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid rgba(201,168,107,0.4); padding-bottom: 6px; }
    .fc-title { font-family: KaiTi, STKaiti, serif; font-size: 28px; letter-spacing: 6px; }
    .fc-line { color: var(--gold); font-family: KaiTi, STKaiti, serif; font-size: 15px; letter-spacing: 3px; }
    .finale-card.debt .fc-title { color: #b8bdc7; }
    .finale-card.chaos .fc-title { color: #c9a0e8; }
    .finale-card.debt { border-color: #8a93a6; outline-color: rgba(138,147,166,0.35); }
    .finale-card.chaos { border-color: #c9a0e8; outline-color: rgba(201,160,232,0.35); }
    /* 三线插画（CSS 图形零新资产）：善=花海拱列 / 亏=灰烬斜雨 / 乱=错位方块 */
    .fc-art { height: 96px; margin: 12px 0; display: flex; align-items: flex-end; justify-content: center; gap: 14px; }
    .fc-art i { display: block; }
    .finale-card.good .fc-art i {
      width: 26px; border-radius: 50% 50% 6px 6px;
      background: radial-gradient(circle at 50% 30%, #ffd9a0 0%, #e8a0b4 55%, rgba(201,168,107,0.25) 100%);
      box-shadow: 0 0 18px rgba(255,200,150,0.35);
      animation: fc-bloom 3.2s ease-in-out infinite alternate;
    }
    .finale-card.good .fc-art i:nth-child(odd) { height: 64px; }
    .finale-card.good .fc-art i:nth-child(even) { height: 88px; }
    .finale-card.good .fc-art i:nth-child(2) { animation-delay: 0.4s; }
    .finale-card.good .fc-art i:nth-child(4) { animation-delay: 0.8s; }
    @keyframes fc-bloom { from { transform: translateY(2px) scale(0.97); } to { transform: translateY(-4px) scale(1.03); } }
    .finale-card.debt .fc-art { align-items: flex-start; gap: 10px; }
    .finale-card.debt .fc-art i {
      width: 8px; border-radius: 2px;
      background: linear-gradient(180deg, rgba(178,182,190,0.85), rgba(90,94,102,0.2));
      animation: fc-ash 2.6s ease-in-out infinite alternate;
    }
    .finale-card.debt .fc-art i:nth-child(odd) { height: 52px; }
    .finale-card.debt .fc-art i:nth-child(even) { height: 82px; margin-top: 10px; }
    .finale-card.debt .fc-art i:nth-child(2) { animation-delay: 0.5s; }
    .finale-card.debt .fc-art i:nth-child(4) { animation-delay: 1s; }
    @keyframes fc-ash { from { opacity: 0.5; transform: translateY(0); } to { opacity: 1; transform: translateY(6px); } }
    .finale-card.chaos .fc-art { align-items: center; }
    .finale-card.chaos .fc-art i {
      width: 30px; height: 30px; border-radius: 4px; mix-blend-mode: screen;
      animation: fc-shift 2.8s ease-in-out infinite alternate;
    }
    .finale-card.chaos .fc-art i:nth-child(1) { background: rgba(201,120,232,0.75); transform: rotate(12deg); }
    .finale-card.chaos .fc-art i:nth-child(2) { background: rgba(120,220,232,0.7); transform: rotate(-8deg) translateY(12px); animation-delay: 0.3s; }
    .finale-card.chaos .fc-art i:nth-child(3) { background: rgba(232,190,120,0.75); transform: rotate(24deg) translateX(-6px); animation-delay: 0.6s; }
    .finale-card.chaos .fc-art i:nth-child(4) { background: rgba(140,232,150,0.6); transform: rotate(-18deg) translateY(-10px); animation-delay: 0.9s; }
    @keyframes fc-shift { to { transform: translate(6px, -6px) rotate(8deg); } }
    .fc-stats { color: var(--paper); margin: 6px 0; }
    .fc-stats .row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(138,147,166,0.25); padding: 2px 0; }
    .fc-stats .k { color: var(--dim); }
    .fc-rule { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
    .fc-foot { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; border-top: 1px dashed rgba(138,147,166,0.3); padding-top: 8px; margin-top: 10px; }
    /* 海报一句话判词 */
    .fc-desc { color: var(--paper); font: 15px/1.9 KaiTi, "STKaiti", serif; margin: 8px 0 4px; }
    /* 海报柒格终局态（1..6 夜付/欠/未至 + 柒=终局） */
    .fc-nights { display: flex; gap: 6px; margin: 10px 0 2px; }
    .fc-nights span {
      flex: 1; text-align: center; padding: 3px 0; font-size: 12px; color: var(--dim);
      border: 1px solid rgba(138,147,166,0.35); border-radius: 3px;
    }
    .fc-nights span.ok { color: var(--green); border-color: rgba(143,212,138,0.5); }
    .fc-nights span.bad { color: var(--red); border-color: rgba(217,106,90,0.5); }
    .fc-nights span.fin { color: #c9a0e8; border-color: rgba(201,160,232,0.55); box-shadow: 0 0 8px rgba(201,160,232,0.2); }
    /* 标题页回响预告（终幕后解锁的一行字，§7.5 P1） */
    .g-title-echo {
      color: #9fc8e8; font-family: KaiTi, STKaiti, serif; font-size: 15px; letter-spacing: 3px;
      padding: 6px 18px; border: 1px dashed rgba(159,200,232,0.4); border-radius: 3px;
      background: rgba(159,200,232,0.05);
    }
    /* 进度页柒格终局状态 */
    .g-night.fin { border-color: #c9a0e8; box-shadow: 0 0 14px rgba(201,160,232,0.25); }
    .g-night.fin .n-num { color: #c9a0e8; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="game-ui"></div>
  <div id="hud">boot…</div>
  <div id="hint" style="opacity:0"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
